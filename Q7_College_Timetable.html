<!DOCTYPE html>
<html>
<head>
    <title>College Timetable</title>

    <style>
        table {
            width: 90%;
            border-collapse: collapse;
            text-align: center;
        }

        th, td {
            border: 1px solid black;
            padding: 12px;
        }

        th {
            background-color: lightblue;
        }
    </style>

</head>

<body>

    <h2 align="center">College Timetable</h2>

    <table>

        <tr>
            <th>Day</th>
            <th>9-10 AM</th>
            <th>10-11 AM</th>
            <th>11-12 PM</th>
            <th>12-1 PM</th>
            <th>1-2 PM</th>
        </tr>

        <tr>
            <td>Monday</td>
            <td>Python</td>
            <td>DBMS</td>
            <td rowspan="2">Web Development</td>
            <td>Break</td>
            <td>Maths</td>
        </tr>

        <tr>
            <td>Tuesday</td>
            <td>Java</td>
            <td>Python</td>
            <td>Break</td>
            <td>English</td>
        </tr>

        <tr>
            <td>Wednesday</td>
            <td colspan="2">Web Development Lab</td>
            <td>DBMS</td>
            <td>Break</td>
            <td>Python</td>
        </tr>

        <tr>
            <td>Thursday</td>
            <td>Maths</td>
            <td>Java</td>
            <td>English</td>
            <td>Break</td>
            <td>DBMS</td>
        </tr>

        <tr>
            <td>Friday</td>
            <td>Python</td>
            <td>DBMS</td>
            <td>Java</td>
            <td>Break</td>
            <td>Sports</td>
        </tr>

    </table>

</body>
</html>
